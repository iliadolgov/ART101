<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control a sound</title>
    <link rel="stylesheet" href="control-sound.css">
    <script src="jquery-3.7.1.min.js"></script>
    <script src="control-sound.js" defer></script>
</head>
<body>
    <audio id="sound" src="tone.wav" preload="metadata"></audio>
    <div class="controls">
        <button id="play-button" type="button">Play</button>
        <button id="pause-button" type="button">Pause</button>
        <button id="stop-button" type="button">Stop</button>
    </div>
    <p id="status" aria-live="polite">Not playing.</p>
</body>
</html>
