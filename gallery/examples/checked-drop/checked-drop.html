<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag, drop, check</title>
    <link rel="stylesheet" href="checked-drop.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="checked-drop.js" defer></script>
</head>
<body>
    <p>Drag either item onto the target. It is looking for A.</p>
    <div id="items">
        <!-- draggable lets the browser start dragging this element. -->
        <div id="item-a" class="item" draggable="true">A</div>
        <div id="item-b" class="item" draggable="true">B</div>
    </div>
    <div id="target">Drop an item here</div>
    <p id="result" aria-live="polite">No item checked yet.</p>
</body>
</html>
