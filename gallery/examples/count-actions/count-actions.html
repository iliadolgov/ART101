<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count actions and change the response</title>
    <link rel="stylesheet" href="count-actions.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="count-actions.js" defer></script>
</head>
<body>
    <p id="instruction"></p>
    <button id="count-button" type="button">Add 1</button>
    <p class="count-line">Count: <span id="count">0</span></p>
    <p id="result" aria-live="polite">Below the threshold.</p>
</body>
</html>
