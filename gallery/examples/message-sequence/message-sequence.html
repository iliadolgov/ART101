<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move through a sequence</title>
    <link rel="stylesheet" href="message-sequence.css">
    <script src="jquery-3.7.1.min.js"></script>
    <script src="message-sequence.js" defer></script>
</head>
<body>
    <p>Use Next to move through the messages.</p>
    <div id="controls">
        <button id="next-button" type="button">Next</button>
        <button id="restart-button" type="button">Restart sequence</button>
    </div>
    <p id="message" aria-live="polite"></p>
</body>
</html>
